<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thu quet BLE</title>
<style>
  body { font-family: sans-serif; padding: 16px; font-size: 18px; }
  button { font-size: 22px; padding: 14px 20px; margin: 8px 0; }
  #kq { white-space: pre-wrap; font-family: monospace; background: #eee; padding: 10px; margin-top: 12px; }
</style>
</head>
<body>
<h2>Thu quet BLE</h2>
<button id="nut">BAM DE QUET</button>
<div id="kq">Chua quet.</div>

<script>
const kq = document.getElementById('kq');

function hex(dv) {
  return Array.from(new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength))
    .map(b => b.toString(16).padStart(2, '0')).join('');
}

document.getElementById('nut').onclick = async () => {
  if (!navigator.bluetooth) {
    kq.textContent = 'LOI: Trinh duyet nay khong ho tro Web Bluetooth. Hay dung Chrome tren Android.';
    return;
  }
  if (!navigator.bluetooth.requestLEScan) {
    kq.textContent = 'LOI: Chrome nay chua co chuc nang quet. Kiem tra da bat flag chua.';
    return;
  }
  try {
    kq.textContent = 'Dang quet... (neu Chrome hoi, bam Cho phep)';
    navigator.bluetooth.addEventListener('advertisementreceived', (e) => {
      const d = e.manufacturerData.get(0xFFFF);
      if (!d) return;
      kq.textContent = 'THAY BOARD!\n' +
        'Cuong do song: ' + e.rssi + ' dBm\n' +
        'Du lieu: ' + hex(d) + '\n' +
        'Gio nhan: ' + new Date().toLocaleTimeString();
    });
    await navigator.bluetooth.requestLEScan({
      filters: [{ manufacturerData: [{ companyIdentifier: 0xFFFF }] }],
      keepRepeatedDevices: true
    });
  } catch (err) {
    kq.textContent = 'LOI: ' + err.name + ' - ' + err.message;
  }
};
</script>
</body>
</html>
