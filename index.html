<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diem danh BLE</title>
</head>
<body>
<h2>Diem danh BLE</h2>
<button id="nut" style="font-size:20px;padding:15px 30px;">BAM DE DIEM DANH</button>
<div id="kq" style="margin-top:20px;font-size:16px;">Chua quet.</div>
<script>
const kq = document.getElementById('kq');

function hex(dv) {
  return Array.from(new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength))
    .map(b => b.toString(16).padStart(2, '0')).join('');
}

document.getElementById('nut').onclick = async () => {
  if (!navigator.bluetooth) {
    kq.textContent = 'LOI: Trinh duyet nay khong ho tro Web Bluetooth.';
    return;
  }
  try {
    kq.textContent = 'Dang mo danh sach thiet bi... hay chon dung ten board.';

    const device = await navigator.bluetooth.requestDevice({
      filters: [{ manufacturerData: [{ companyIdentifier: 0xFFFF }] }],
      optionalManufacturerData: [0xFFFF]
    });

    kq.textContent = 'Da chon: ' + device.name + '. Dang cho du lieu...';

    device.addEventListener('advertisementreceived', (e) => {
      const d = e.manufacturerData.get(0xFFFF);
      if (!d) return;
      kq.textContent =
        'DIEM DANH THANH CONG!\n' +
        'Thiet bi: ' + device.name + '\n' +
        'Cuong do song: ' + e.rssi + ' dBm\n' +
        'Du lieu: ' + hex(d) + '\n' +
        'Gio nhan: ' + new Date().toLocaleTimeString();
    });

    await device.watchAdvertisements();

  } catch (err) {
    kq.textContent = 'LOI: ' + err.name + ' - ' + err.message;
  }
};
</script>
</body>
</html>
